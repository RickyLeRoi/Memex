<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Memex</title>
    <!-- 20261011 ++ RG #app_icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#121e41" />
    <meta property="og:title" content="Memex" />
    <meta property="og:image" content="/og-image.png" />
    <!-- 20261003 ++ RG #theme_toggle: apply stored theme before first paint to avoid a light flash -->
    <script>
      try {
        var theme = localStorage.getItem("memex-theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
