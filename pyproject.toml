[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memex"
version = "0.1.0"
description = "Digest di Teams, Outlook, Notion e link salvati con un LLM locale"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Riccardo Giordano (RickyLeRoi)" }]
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
social = ["yt-dlp"]
render = ["playwright>=1.45"]
transcribe = ["yt-dlp", "faster-whisper>=1.0"]
pdf = ["pypdf>=4"]
all = ["yt-dlp", "playwright>=1.45", "faster-whisper>=1.0", "pypdf>=4"]

[project.scripts]
digest = "digest.__main__:main"

[tool.setuptools]
packages = ["digest", "digest.sources", "digest.web"]

[tool.setuptools.package-data]
digest = ["config.example.toml"]
